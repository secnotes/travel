name = "youxing-llm-proxy"
main = "llm-proxy.ts"
compatibility_date = "2024-11-01"

# 环境变量请勿写在此文件（会进仓库泄露）。
# 部署后在 Cloudflare Dashboard → Workers → Settings → Variables 配置：
#   LLM_BASE_URL    服务商 baseURL，如 https://api.deepseek.com/v1
#   LLM_API_KEY     API Key（标记为 Secret，加密存储）
#   LLM_MODEL       模型名，如 deepseek-chat
#   ALLOWED_ORIGIN  你的站点域名，如 https://你的用户名.github.io
